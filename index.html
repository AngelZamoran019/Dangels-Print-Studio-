<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Dangels Print Studio — centro de accesos a proyectos y páginas.">
  <title>Dangels Print Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Dangels Print Studio - inicio">
        <img class="brand-logo" src="data:image/webp;base64," + b64 + "" alt="Dangels Print Studio">
      </a>
      <span class="status"><i></i> ONLINE</span>
    </header>

    <section class="hero">
      <p class="eyebrow">CENTRO DE ACCESOS</p>
      <h1>Todo en un solo lugar<span>.</span></h1>
      <p class="hero-text">Un espacio central para entrar rápidamente a mis páginas, proyectos y herramientas.</p>
    </section>

    <section class="access-section" aria-labelledby="access-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">MIS PÁGINAS</p>
          <h2 id="access-title">Accesos directos</h2>
        </div>
        <span class="counter" id="counter">0</span>
      </div>

      <div class="access-grid" id="access-grid"></div>
    </section>

    <footer>
      <span>© <span id="year"></span> Dangels Print Studio</span>
      <span>PERSONAL HUB</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
